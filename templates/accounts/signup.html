{% extends 'base.html' %}

{% block title %}Inscription — OpportuniCI{% endblock %}

{% block content %}
<div class="min-h-screen bg-[#FAFAF8] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="text-2xl font-bold text-gray-900">
                Opportuni<span class="text-[#2D6A4F]">CI</span>
            </a>
            <p class="text-gray-500 mt-2 text-sm">Crée ton compte gratuitement</p>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <h1 class="text-xl font-bold text-gray-900 mb-6">Commencer maintenant</h1>
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm font-medium text-gray-700 mb-1 block">Prénom</label>
                        <input type="text" name="first_name" placeholder="Ton prénom"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D6A4F]">
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-700 mb-1 block">Nom</label>
                        <input type="text" name="last_name" placeholder="Ton nom"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D6A4F]">
                    </div>
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-1 block">Email</label>
                    <input type="email" name="email" placeholder="ton@email.com"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D6A4F]">
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-1 block">Mot de passe</label>
                    <input type="password" name="password1" placeholder="••••••••"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D6A4F]">
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-1 block">Confirmer</label>
                    <input type="password" name="password2" placeholder="••••••••"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D6A4F]">
                </div>
                {% if form.errors %}
                <div class="bg-red-50 text-red-700 text-sm px-4 py-3 rounded-xl">
                    Vérifie les informations saisies.
                </div>
                {% endif %}
                <button type="submit"
                    class="w-full bg-[#2D6A4F] text-white font-medium py-3 rounded-xl hover:bg-[#245A42] transition text-sm">
                    Créer mon compte
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-6">
                Déjà un compte ?
                <a href="{% url 'accounts:login' %}" class="text-[#2D6A4F] font-medium hover:underline">Se connecter</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
