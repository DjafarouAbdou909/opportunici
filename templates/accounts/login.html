{% extends 'base.html' %}
{% block title %}Connexion — OpportuniCI{% endblock %}
{% block content %}
<div class="min-h-screen bg-[#FAFAF8] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="text-2xl font-bold text-gray-900">
                Opportuni<span class="text-[#2D6A4F]">CI</span>
            </a>
            <p class="text-gray-500 mt-2 text-sm">Bon retour 👋</p>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <h1 class="text-xl font-bold text-gray-900 mb-6">Se connecter</h1>
            <form method="POST" autocomplete="new-password">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="text-sm font-medium text-gray-700 mb-1 block">Email</label>
                    <input type="email" name="username"
                        placeholder="ton@email.com"
                        autocomplete="new-password"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D6A4F] bg-white">
                </div>
                <div class="mb-6">
                    <label class="text-sm font-medium text-gray-700 mb-1 block">Mot de passe</label>
                    <input type="password" name="password"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D6A4F] bg-white">
                </div>
                {% if form.errors %}
                <div class="bg-red-50 text-red-700 text-sm px-4 py-3 rounded-xl mb-4">
                    Email ou mot de passe incorrect.
                </div>
                {% endif %}
                <button type="submit"
                    class="w-full bg-[#2D6A4F] text-white font-medium py-3 rounded-xl hover:bg-[#245A42] text-sm">
                    Se connecter
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-6">
                Pas encore de compte ?
                <a href="{% url 'accounts:signup' %}" class="text-[#2D6A4F] font-medium hover:underline">
                    S'inscrire
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
